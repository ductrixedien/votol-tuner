<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WebOS — Máy tính ảo</title>
<style>
:root{
  --accent:#4f8cff;
  --bg-win:rgba(28,32,44,.93);
  --titlebar:rgba(44,50,66,.96);
  --text:#e8ecf4;
  --sub:#98a2b8;
  --border:rgba(255,255,255,.09);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;font-family:'Segoe UI',system-ui,-apple-system,sans-serif;color:var(--text);background:#000}
button{font-family:inherit;cursor:pointer;border:none;outline:none}

/* ===== DESKTOP ===== */
#desktop{position:fixed;inset:0;transition:background .5s}
#desktop.wp0{background:linear-gradient(135deg,#0f2027,#203a43,#2c5364)}
#desktop.wp1{background:linear-gradient(135deg,#1e3c72,#2a5298,#6b46c1)}
#desktop.wp2{background:linear-gradient(135deg,#42275a,#734b6d)}
#desktop.wp3{background:linear-gradient(135deg,#0b486b,#f56217)}
#desktop.wp4{background:linear-gradient(135deg,#134e5e,#71b280)}
#desktop::after{content:'';position:absolute;inset:0;background:radial-gradient(circle at 70% 20%,rgba(255,255,255,.08),transparent 60%);pointer-events:none}

#desktop-icons{position:absolute;top:16px;left:16px;display:flex;flex-direction:column;flex-wrap:wrap;gap:6px;max-height:calc(100vh - 130px);z-index:1}
.desk-icon{width:92px;padding:10px 4px;border-radius:10px;text-align:center;cursor:pointer;font-size:12px;transition:.15s;user-select:none;border:1px solid transparent}
.desk-icon:hover{background:rgba(255,255,255,.13);border-color:rgba(255,255,255,.15)}
.desk-icon:active{transform:scale(.95)}
.desk-icon .ic{font-size:32px;display:block;margin-bottom:6px;filter:drop-shadow(0 2px 4px rgba(0,0,0,.5))}

/* ===== WINDOWS ===== */
#windows-layer{position:fixed;inset:0 0 52px 0;pointer-events:none;z-index:10}
.window{position:absolute;pointer-events:auto;background:var(--bg-win);border:1px solid var(--border);border-radius:12px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 24px 70px rgba(0,0,0,.65);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);animation:winIn .16s ease}
@keyframes winIn{from{opacity:0;transform:scale(.96) translateY(8px)}to{opacity:1;transform:none}}
.window.minimized{display:none}
.window.maximized{border-radius:0!important;left:0!important;top:0!important;width:100%!important;height:100%!important}
.title-bar{height:38px;background:var(--titlebar);display:flex;align-items:center;justify-content:space-between;padding:0 4px 0 12px;flex-shrink:0;border-bottom:1px solid var(--border);user-select:none}
.window.maximized .title-bar{cursor:default}
.title{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:500;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;pointer-events:none}
.title .app-icon{font-size:15px}
.win-controls{display:flex;gap:2px}
.win-controls button{width:34px;height:30px;background:transparent;color:var(--sub);border-radius:6px;font-size:13px;transition:.12s;line-height:1}
.win-controls button:hover{background:rgba(255,255,255,.12);color:#fff}
.win-controls .btn-close:hover{background:#e5484d;color:#fff}
.window-body{flex:1;overflow:auto;position:relative}
.resizer{position:absolute;right:0;bottom:0;width:16px;height:16px;cursor:nwse-resize;z-index:5}
.window.maximized .resizer{display:none}

/* ===== TASKBAR ===== */
#taskbar{position:fixed;left:0;right:0;bottom:0;height:52px;background:rgba(16,19,28,.88);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border-top:1px solid var(--border);display:flex;align-items:center;padding:0 8px;gap:6px;z-index:100000}
#start-btn{width:44px;height:40px;border-radius:9px;background:transparent;font-size:20px;display:flex;align-items:center;justify-content:center;transition:.15s}
#start-btn:hover{background:rgba(255,255,255,.13)}
#start-btn.active{background:var(--accent)}
#task-items{flex:1;display:flex;gap:5px;overflow-x:auto;overflow-y:hidden;scrollbar-width:none}
#task-items::-webkit-scrollbar{display:none}
.task-item{height:38px;padding:0 14px;border-radius:8px;background:rgba(255,255,255,.06);color:var(--text);font-size:12.5px;display:flex;align-items:center;gap:8px;white-space:nowrap;transition:.15s;max-width:190px;border-bottom:2px solid transparent}
.task-item:hover{background:rgba(255,255,255,.13)}
.task-item.active{background:rgba(255,255,255,.16);border-bottom-color:var(--accent)}
.task-item.min{opacity:.55}
#tray{display:flex;align-items:center;gap:12px;padding:0 12px;height:40px;border-radius:8px;font-size:12.5px;transition:.15s;color:var(--sub)}
#tray:hover{background:rgba(255,255,255,.1)}
#tray .time{font-weight:600;color:var(--text)}

/* ===== START MENU ===== */
#start-menu{position:fixed;left:10px;bottom:62px;width:360px;max-height:64vh;background:rgba(22,26,38,.96);backdrop-filter:blur(28px);-webkit-backdrop-filter:blur(28px);border:1px solid var(--border);border-radius:16px;padding:14px;z-index:100001;display:none;box-shadow:0 24px 70px rgba(0,0,0,.7);overflow-y:auto}
#start-menu.open{display:block;animation:pop .18s cubic-bezier(.2,.9,.3,1.2)}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:none}}
#start-menu h4{font-size:11px;text-transform:uppercase;letter-spacing:1.3px;color:var(--sub);margin:6px 8px 12px;font-weight:600}
.app-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.app-tile{padding:14px 6px;border-radius:10px;background:transparent;color:var(--text);display:flex;flex-direction:column;align-items:center;gap:7px;font-size:11.5px;transition:.15s;text-align:center}
.app-tile:hover{background:rgba(255,255,255,.11)}
.app-tile:active{transform:scale(.95)}
.app-tile .ic{font-size:26px}
.sm-footer{margin-top:12px;padding-top:12px;border-top:1px solid var(--border);display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--sub);padding-left:8px}
.sm-avatar{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,var(--accent),#a855f7);display:flex;align-items:center;justify-content:center;font-size:14px}

/* ===== APP STYLES ===== */
.pad{padding:16px}
/* Calculator */
.calc{padding:14px;display:flex;flex-direction:column;height:100%;gap:12px}
.calc-display{background:rgba(0,0,0,.35);border:1px solid var(--border);border-radius:10px;padding:16px;text-align:right;font-size:32px;font-weight:300;min-height:74px;display:flex;align-items:center;justify-content:flex-end;overflow:hidden;word-break:break-all;letter-spacing:.5px}
.calc-keys{flex:1;display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.calc-keys button{background:rgba(255,255,255,.07);color:var(--text);border-radius:10px;font-size:19px;font-weight:500;transition:.12s}
.calc-keys button:hover{background:rgba(255,255,255,.16)}
.calc-keys button:active{transform:scale(.94)}
.calc-keys .op{background:rgba(79,140,255,.18);color:#9dc0ff}
.calc-keys .op:hover{background:rgba(79,140,255,.32)}
.calc-keys .eq{background:var(--accent);color:#fff}
.calc-keys .eq:hover{background:#6b9dff}

/* Notepad */
.np-wrap{display:flex;flex-direction:column;height:100%}
.np-toolbar{display:flex;gap:8px;padding:9px 12px;border-bottom:1px solid var(--border);align-items:center;flex-shrink:0;flex-wrap:wrap}
.tb-btn{padding:6px 13px;border-radius:7px;background:rgba(255,255,255,.08);color:var(--text);font-size:12.5px;transition:.12s}
.tb-btn:hover{background:rgba(255,255,255,.17)}
.tb-btn.primary{background:var(--accent);color:#fff}
.tb-btn.primary:hover{background:#6b9dff}
.np-name{flex:1;min-width:110px;background:rgba(0,0,0,.28);border:1px solid var(--border);border-radius:7px;padding:6px 11px;color:var(--text);font-size:12.5px;outline:none}
.np-name:focus{border-color:var(--accent)}
.np-area{flex:1;background:rgba(0,0,0,.22);border:none;outline:none;color:var(--text);padding:16px;font-family:'Consolas','Monaco',monospace;font-size:14px;line-height:1.65;resize:none}
.np-status{padding:6px 14px;font-size:11.5px;color:var(--sub);border-top:1px solid var(--border);flex-shrink:0}

/* Files */
.fm-toolbar{display:flex;gap:8px;padding:10px 12px;border-bottom:1px solid var(--border);align-items:center;flex-shrink:0}
.file-list{padding:8px}
.file-row{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:9px;cursor:pointer;transition:.12s;font-size:13.5px}
.file-row:hover{background:rgba(255,255,255,.09)}
.file-row .ic{font-size:20px}
.file-row .meta{margin-left:auto;font-size:11.5px;color:var(--sub)}
.file-row .del{opacity:0;padding:4px 9px;border-radius:6px;background:rgba(229,72,77,.2);color:#ff8b8f;font-size:11.5px;transition:.12s}
.file-row:hover .del{opacity:1}
.file-row .del:hover{background:#e5484d;color:#fff}
.empty{padding:50px 20px;text-align:center;color:var(--sub);font-size:13px}

/* Terminal */
.term{height:100%;background:rgba(6,8,14,.85);padding:14px;font-family:'Consolas','Monaco',monospace;font-size:13.5px;display:flex;flex-direction:column;overflow:hidden}
.term-out{flex:1;overflow-y:auto;white-space:pre-wrap;word-break:break-word;line-height:1.55}
.term-out .cmd{color:#7dd3fc}
.term-out .ok{color:#86efac}
.term-out .err{color:#ff8b8f}
.term-out .info{color:#fbbf24}
.term-line{display:flex;gap:8px;align-items:center;margin-top:6px;flex-shrink:0}
.term-prompt{color:#86efac;white-space:nowrap}
.term-in{flex:1;background:transparent;border:none;outline:none;color:var(--text);font-family:inherit;font-size:13.5px;caret-color:#86efac}

/* Paint */
.pt-wrap{display:flex;flex-direction:column;height:100%}
.pt-bar{display:flex;gap:9px;padding:9px 12px;border-bottom:1px solid var(--border);align-items:center;flex-shrink:0;flex-wrap:wrap}
.pt-bar input[type=color]{width:36px;height:32px;border:1px solid var(--border);border-radius:7px;background:transparent;cursor:pointer;padding:2px}
.pt-bar input[type=range]{width:110px;accent-color:var(--accent)}
.pt-bar label{font-size:12px;color:var(--sub);display:flex;align-items:center;gap:7px}
.pt-canvas{flex:1;background:#fff;cursor:crosshair;display:block;touch-action:none}

/* Clock */
.clock-wrap{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:20px}
.clock-time{font-size:52px;font-weight:200;letter-spacing:2px;font-variant-numeric:tabular-nums}
.clock-date{font-size:14px;color:var(--sub);text-transform:capitalize}
.clock-sec{font-size:12px;color:var(--accent);letter-spacing:3px}

/* Settings */
.set-group{margin-bottom:22px}
.set-group h5{font-size:12px;text-transform:uppercase;letter-spacing:1.2px;color:var(--sub);margin-bottom:11px;font-weight:600}
.wp-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.wp-item{height:62px;border-radius:10px;cursor:pointer;border:2px solid transparent;transition:.15s}
.wp-item:hover{transform:scale(1.05)}
.wp-item.sel{border-color:var(--accent);box-shadow:0 0 0 3px rgba(79,140,255,.25)}
.wp-item.w0{background:linear-gradient(135deg,#0f2027,#203a43,#2c5364)}
.wp-item.w1{background:linear-gradient(135deg,#1e3c72,#2a5298,#6b46c1)}
.wp-item.w2{background:linear-gradient(135deg,#42275a,#734b6d)}
.wp-item.w3{background:linear-gradient(135deg,#0b486b,#f56217)}
.wp-item.w4{background:linear-gradient(135deg,#134e5e,#71b280)}
.color-row{display:flex;gap:10px;flex-wrap:wrap}
.color-dot{width:34px;height:34px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:.15s}
.color-dot:hover{transform:scale(1.12)}
.color-dot.sel{border-color:#fff;box-shadow:0 0 0 3px rgba(255,255,255,.2)}

/* Game */
.ttt{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:20px}
.ttt h3{font-size:17px;font-weight:600}
.ttt-status{font-size:13.5px;color:var(--sub);min-height:20px}
.ttt-board{display:grid;grid-template-columns:repeat(3,82px);grid-template-rows:repeat(3,82px);gap:8px}
.ttt-cell{background:rgba(255,255,255,.07);border-radius:11px;font-size:38px;display:flex;align-items:center;justify-content:center;transition:.13s;color:var(--text)}
.ttt-cell:hover{background:rgba(255,255,255,.15)}
.ttt-cell.win{background:rgba(79,140,255,.32)}

/* Browser */
.br-bar{display:flex;gap:8px;padding:9px 12px;border-bottom:1px solid var(--border);align-items:center;flex-shrink:0}
.br-url{flex:1;background:rgba(0,0,0,.3);border:1px solid var(--border);border-radius:20px;padding:8px 16px;color:var(--text);font-size:13px;outline:none}
.br-url:focus{border-color:var(--accent)}
.br-frame{flex:1;width:100%;border:none;background:#fff}
.br-note{padding:40px 30px;text-align:center;color:var(--sub);font-size:13px;line-height:1.8}

::-webkit-scrollbar{width:11px;height:11px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.16);border-radius:6px;border:3px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,.3);background-clip:content-box}
</style>
</head>
<body>

<div id="desktop" class="wp1">
  <div id="desktop-icons"></div>
</div>

<div id="windows-layer"></div>

<div id="taskbar">
  <button id="start-btn" title="Menu">⊞</button>
  <div id="task-items"></div>
  <div id="tray">
    <span id="tray-icon">🔊</span>
    <span class="time" id="tray-time">--:--</span>
  </div>
</div>

<div id="start-menu">
  <h4>Ứng dụng</h4>
  <div class="app-grid" id="start-grid"></div>
  <div class="sm-footer"><div class="sm-avatar">👤</div><div>Người dùng WebOS</div></div>
</div>

<script>
/* =========================================================
   HỆ THỐNG TỆP TIN ẢO (localStorage)
   ========================================================= */
const FS = {
  KEY: 'webos_files_v1',
  all(){ try{ return JSON.parse(localStorage.getItem(this.KEY) || '{}'); }catch(e){ return {}; } },
  save(name, content){
    const f = this.all();
    f[name] = { content, mtime: Date.now() };
    localStorage.setItem(this.KEY, JSON.stringify(f));
  },
  read(name){ const f = this.all(); return f[name] ? f[name].content : null; },
  del(name){ const f = this.all(); delete f[name]; localStorage.setItem(this.KEY, JSON.stringify(f)); },
  list(){ return Object.entries(this.all()).map(([n,v])=>({name:n, ...v})).sort((a,b)=>b.mtime-a.mtime); }
};

/* =========================================================
   QUẢN LÝ CỬA SỔ
   ========================================================= */
let zTop = 100;
let winSeq = 0;
const wins = new Map();      // id -> { el, btn, minimized, maximized, prev }
let activeId = null;

function createWindow(appId, { title, icon, width = 640, height = 460, build }) {
  if (wins.has(appId)) {           // đã mở -> chỉ focus
    const w = wins.get(appId);
    if (w.minimized) toggleMinimize(appId);
    focusWindow(appId);
    return w;
  }

  const id = appId;
  const el = document.createElement('div');
  el.className = 'window';
  el.dataset.id = id;
  el.style.width  = width + 'px';
  el.style.height = height + 'px';
  const n = ++winSeq;
  const off = (n % 7) * 26;
  el.style.left = Math.max(12, Math.round((window.innerWidth  - width ) / 2) - 90 + off) + 'px';
  el.style.top  = Math.max(12, Math.round((window.innerHeight - height) / 2) - 60 + off) + 'px';
  el.style.zIndex = ++zTop;

  el.innerHTML = `
    <div class="title-bar">
      <div class="title"><span class="app-icon">${icon}</span><span class="app-title">${title}</span></div>
      <div class="win-controls">
        <button class="btn-min"   title="Thu nhỏ">—</button>
        <button class="btn-max"   title="Phóng to">▢</button>
        <button class="btn-close" title="Đóng">✕</button>
      </div>
    </div>
    <div class="window-body"></div>
    <div class="resizer"></div>`;

  const titleBar = el.querySelector('.title-bar');
  const body     = el.querySelector('.window-body');
  const resizer  = el.querySelector('.resizer');

  // Sự kiện điều khiển
  el.querySelector('.btn-close').onclick = e => { e.stopPropagation(); closeWindow(id); };
  el.querySelector('.btn-min').onclick   = e => { e.stopPropagation(); toggleMinimize(id); };
  el.querySelector('.btn-max').onclick   = e => { e.stopPropagation(); toggleMaximize(id); };
  el.addEventListener('pointerdown', () => focusWindow(id));

  makeDraggable(el, titleBar);
  makeResizable(el, resizer);

  document.getElementById('windows-layer').appendChild(el);

  // Nút trên taskbar
  const btn = document.createElement('button');
  btn.className = 'task-item active';
  btn.innerHTML = `<span>${icon}</span><span>${title}</span>`;
  btn.onclick = () => {
    const w = wins.get(id);
    if (!w) return;
    if (w.minimized) { toggleMinimize(id); focusWindow(id); }
    else if (activeId === id) toggleMinimize(id);
    else focusWindow(id);
  };
  document.getElementById('task-items').appendChild(btn);

  const rec = { el, btn, minimized:false, maximized:false, prev:null, appId, title, icon };
  wins.set(id, rec);

  build(body, { id, close: () => closeWindow(id), setTitle: t => {
    el.querySelector('.app-title').textContent = t;
    btn.querySelector('span:last-child').textContent = t;
  }});

  focusWindow(id);
  return rec;
}

function focusWindow(id){
  const w = wins.get(id);
  if (!w) return;
  activeId = id;
  w.el.style.zIndex = ++zTop;
  wins.forEach((v,k)=>{
    v.btn.classList.toggle('active', k === id);
    v.el.style.opacity = (k === id) ? '1' : '.97';
  });
}

function closeWindow(id){
  const w = wins.get(id);
  if (!w) return;
  w.el.style.animation = 'winIn .12s reverse';
  setTimeout(()=>{
    w.el.remove();
    w.btn.remove();
    wins.delete(id);
    if (activeId === id) activeId = null;
  }, 100);
}

function toggleMinimize(id){
  const w = wins.get(id);
  if (!w) return;
  w.minimized = !w.minimized;
  w.el.classList.toggle('minimized', w.minimized);
  w.btn.classList.toggle('min', w.minimized);
  if (!w.minimized) focusWindow(id);
}

function toggleMaximize(id){
  const w = wins.get(id);
  if (!w) return;
  if (w.maximized) {
    Object.assign(w.el.style, w.prev);
    w.el.classList.remove('maximized');
    w.maximized = false;
  } else {
    w.prev = { left:w.el.style.left, top:w.el.style.top, width:w.el.style.width, height:w.el.style.height };
    w.el.classList.add('maximized');
    w.maximized = true;
  }
  setTimeout(()=>window.dispatchEvent(new Event('resize')), 30);
}

/* Kéo cửa sổ */
function makeDraggable(el, handle){
  let dragging=false, sx=0, sy=0, ox=0, oy=0;
  handle.addEventListener('pointerdown', e=>{
    if (e.target.closest('.win-controls') || el.classList.contains('maximized')) return;
    dragging = true;
    sx = e.clientX; sy = e.clientY;
    ox = parseFloat(el.style.left) || 0;
    oy = parseFloat(el.style.top)  || 0;
    handle.setPointerCapture(e.pointerId);
    handle.style.cursor = 'grabbing';
  });
  handle.addEventListener('pointermove', e=>{
    if (!dragging) return;
    const nx = ox + e.clientX - sx;
    const ny = oy + e.clientY - sy;
    el.style.left = Math.min(Math.max(nx, -el.offsetWidth + 90), window.innerWidth - 90) + 'px';
    el.style.top  = Math.min(Math.max(ny, 0), window.innerHeight - 92) + 'px';
  });
  const stop = e => { dragging=false; handle.style.cursor='grab'; try{handle.releasePointerCapture(e.pointerId);}catch(_){} };
  handle.addEventListener('pointerup', stop);
  handle.addEventListener('pointercancel', stop);
}

/* Đổi kích thước */
function makeResizable(el, handle){
  let rz=false, sx=0, sy=0, ow=0, oh=0;
  handle.addEventListener('pointerdown', e=>{
    e.stopPropagation(); rz=true;
    sx=e.clientX; sy=e.clientY; ow=el.offsetWidth; oh=el.offsetHeight;
    handle.setPointerCapture(e.pointerId);
  });
  handle.addEventListener('pointermove', e=>{
    if(!rz) return;
    el.style.width  = Math.max(280, ow + e.clientX - sx) + 'px';
    el.style.height = Math.max(180, oh + e.clientY - sy) + 'px';
  });
  const stop = e => { rz=false; try{handle.releasePointerCapture(e.pointerId);}catch(_){} };
  handle.addEventListener('pointerup', stop);
  handle.addEventListener('pointercancel', stop);
}

/* =========================================================
   ỨNG DỤNG
   ========================================================= */
const APPS = {
  files:      { name:'File Explorer', icon:'📁', w:720, h:500, build: buildFiles },
  notepad:    { name:'Notepad',       icon:'📝', w:660, h:470, build: buildNotepad },
  calculator: { name:'Máy tính',      icon:'🧮', w:340, h:500, build: buildCalculator },
  terminal:   { name:'Terminal',      icon:'⌨️', w:680, h:430, build: buildTerminal },
  paint:      { name:'Paint',         icon:'🎨', w:760, h:560, build: buildPaint },

/* ---------- CALCULATOR ---------- */
function buildCalculator(body){
  body.innerHTML = `
    <div class="calc">
      <div class="calc-display" id="cd">0</div>
      <div class="calc-keys">
        <button class="op" data-k="C">C</button>
        <button class="op" data-k="DEL">⌫</button>
        <button class="op" data-k="(">(</button>
        <button class="op" data-k=")">)</button>
        <button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button>
        <button class="op" data-k="/">÷</button>
        <button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button>
        <button class="op" data-k="*">×</button>
        <button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button>
        <button class="op" data-k="-">−</button>
        <button data-k="0">0</button><button data-k=".">.</button>
        <button class="op" data-k="%">%</button>
        <button class="op" data-k="+">+</button>
        <button class="eq" data-k="=" style="grid-column:span 4">=</button>
      </div>
    </div>`;
  const disp = body.querySelector('#cd');
  let expr = '';

  const render = () => disp.textContent = expr === '' ? '0' : expr;

  const evaluate = () => {
    let s = expr.replace(/×/g,'*').replace(/÷/g,'/');
    if (!/^[0-9+\-*/.() %]+$/.test(s) || s.trim()==='') { expr=''; render(); return; }
    try {
      s = s.replace(/(\d+(?:\.\d+)?)%/g, '($1/100)');
      const r = Function('"use strict";return ('+s+')')();
      if (!isFinite(r)) throw 0;
      expr = String(Math.round(r * 1e10) / 1e10);
    } catch(e) { expr = 'Lỗi'; }
    render();
  };

  body.querySelectorAll('.calc-keys button').forEach(b=>{
    b.onclick = () => {
      const k = b.dataset.k;
      if (expr === 'Lỗi' && k !== 'C') expr = '';
      if (k === 'C')   { expr = ''; }
      else if (k === 'DEL') { expr = expr.slice(0,-1); }
      else if (k === '=')   { evaluate(); return; }
      else expr += k;
      render();
    };
  });

  // Hỗ trợ bàn phím
  const keyHandler = e => {
    if (!document.body.contains(body)) { document.removeEventListener('keydown', keyHandler); return; }
    if (!wins.get('calculator') || activeId !== 'calculator') return;
    const k = e.key;
    if (/^[0-9+\-*/.()%]$/.test(k)) { expr += k; render(); }
    else if (k === 'Enter') { evaluate(); }
    else if (k === 'Backspace') { expr = expr.slice(0,-1); render(); }
    else if (k === 'Escape') { expr=''; render(); }
  };
  document.addEventListener('keydown', keyHandler);
}

    </div>`;

  const nameI = body.querySelector('#npName');

  let timer = null;

    const t = area.value;
    status.textContent = `${t.length} ký tự · ${t.split(/\s+/).filter(Boolean).length} từ`;
  };
  area.addEventListener('input', ()=>{ refresh(); clearTimeout(timer); timer = setTimeout(autoSave, 1200); });

  function autoSave(){
    const n = nameI.value.trim() || 'khongten.txt';
    FS.save(n, area.value);
    status.textContent = `✔ Đã tự động lưu "${n}"`;
  }

  body.querySelector('#npSave').onclick = () => {
    const n = nameI.value.trim() || 'khongten.txt';
    FS.save(n, area.value);
    status.textContent = `✔ Đã lưu "${n}" lúc ${new Date().toLocaleTimeString('vi-VN')}`;
    api.setTitle('Notepad — ' + n);
  };

      localStorage.removeItem(FS.KEY); render();
    }

  window.addEventListener('focus', render);
}

function escapeHtml(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* ---------- TERMINAL ---------- */
function buildTerminal(body){
  body.innerHTML = `
    <div class="term">
      <div class="term-out" id="tout"></div>
      <div class="term-line">
        <span class="term-prompt">user@webos:~$</span>
        <input class="term-in" id="tin" autocomplete="off" spellcheck="false">
      </div>
    </div>`;
  const out = body.querySelector('#tout');
  const input = body.querySelector('#tin');
  const history = []; let hIdx = -1;

  const print = (text, cls='') => {
    const d = document.createElement('div');
    if (cls) d.className = cls;
    d.textContent = text;
    out.appendChild(d);
    out.scrollTop = out.scrollHeight;
  };

  print('WebOS Terminal v1.0 — gõ "help" để xem danh sách lệnh.', 'info');
  print('');

  const CMDS = {
    help(){
      print('Danh sách lệnh khả dụng:', 'info');
      print('  help              Hiển thị trợ giúp');
      print('  ls / dir          Liệt kê tệp trong hệ thống');
      print('  cat <tên>         Đọc nội dung tệp');
      print('  write <tên> <nd>  Tạo tệp mới');
      print('  rm <tên>          Xóa tệp');
      print('  open <app>        Mở ứng dụng (calc, notepad, files, paint, game...)');
      print('  calc <biểu thức>  Tính toán, ví dụ: calc 25*4+10');
      print('  date              Ngày giờ hiện tại');
      print('  echo <text>       In ra văn bản');
      print('  theme <0-4>       Đổi hình nền');
      print('  clear             Xóa màn hình');
      print('  whoami            Thông tin người dùng');
    },
    ls(){
      const f = FS.list();
      if (!f.length) return print('(thư mục trống)');
      print('Tên tệp'.padEnd(28) + 'Kích thước'.padEnd(14) + 'Sửa đổi', 'info');
      f.forEach(x => print(
        x.name.padEnd(28) +
        (x.content.length + ' B').padEnd(14) +
        new Date(x.mtime).toLocaleString('vi-VN')
      ));
    },
    dir(){ CMDS.ls(); },
    cat(a){
      if (!a) return print('Dùng: cat <tên-tệp>', 'err');
      const c = FS.read(a);
      c === null ? print('Không tìm thấy tệp: ' + a, 'err') : print(c || '(tệp rỗng)');
    },
    write(a){
      const i = a.indexOf(' ');
      if (i < 0) return print('Dùng: write <tên-tệp> <nội dung>', 'err');
      const name = a.slice(0, i), content = a.slice(i+1);
      FS.save(name, content);
      print(`✔ Đã tạo tệp "${name}" (${content.length} ký tự)`, 'ok');
    },
    rm(a){
      if (!a) return print('Dùng: rm <tên-tệp>', 'err');
      if (FS.read(a) === null) return print('Không tìm thấy tệp: ' + a, 'err');
      FS.del(a); print('✔ Đã xóa "' + a + '"', 'ok');
    },
    open(a){
      const map = { calc:'calculator', calculator:'calculator', notepad:'notepad', note:'notepad',
                    files:'files', explorer:'files', paint:'paint', terminal:'terminal',
                    game:'game', clock:'clock', settings:'settings', browser:'browser', about:'about' };
      const id = map[(a||'').toLowerCase()];
      if (!id) return print('Không rõ ứng dụng. Thử: calc, notepad, files, paint, game, clock, settings', 'err');
      launch(id); print('✔ Đang mở ' + APPS[id].name + '...', 'ok');
    },
    calc(a){
      if (!a) return print('Dùng: calc <biểu thức>', 'err');
      if (!/^[0-9+\-*/(). %]+$/.test(a)) return print('Biểu thức không hợp lệ', 'err');
      try {
        const r = Function('"use strict";return ('+a+')')();
        print(a + ' = ' + (Math.round(r*1e10)/1e10), 'ok');
      } catch(e){ print('Lỗi cú pháp', 'err'); }
    },
    date(){ print(new Date().toLocaleString('vi-VN', {dateStyle:'full', timeStyle:'medium'})); },
    echo(a){ print(a || ''); },
    whoami(){ print('user  (WebOS — môi trường mô phỏng trên trình duyệt)'); },
    theme(a){
      const n = parseInt(a,10);
      if (isNaN(n) || n < 0 || n > 4) return print('Dùng: theme <0-4>', 'err');
      setWallpaper(n); print('✔ Đã đổi hình nền #' + n, 'ok');
    },
    clear(){ out.innerHTML = ''; },
  };

  input.addEventListener('keydown', e => {
    if (e.key === 'Enter') {
      const line = input.value.trim();
      input.value = '';
      print('user@webos:~$ ' + line, 'cmd');
      if (!line) return;
      history.push(line); hIdx = history.length;

      const sp = line.indexOf(' ');
      const cmd = (sp < 0 ? line : line.slice(0, sp)).toLowerCase();
      const arg = sp < 0 ? '' : line.slice(sp+1).trim();

      if (CMDS[cmd]) {
        try { CMDS[cmd](arg); } catch(err){ print('Lỗi: ' + err.message, 'err'); }
      } else {
        print(`Lệnh không tồn tại: "${cmd}". Gõ "help" để được trợ giúp.`, 'err');
      }
      print('');
    } else if (e.key === 'ArrowUp') {
      e.preventDefault();
      if (hIdx > 0) input.value = history[--hIdx];
    } else if (e.key === 'ArrowDown') {
      e.preventDefault();
      if (hIdx < history.length - 1) input.value = history[++hIdx];
      else { hIdx = history.length; input.value = ''; }
    }
  });

  body.addEventListener('click', () => input.focus());
  setTimeout(()=>input.focus(), 120);
}

/* ---------- PAINT ---------- */
function buildPaint(body){
  body.innerHTML = `
    <div class="pt-wrap">
      <div class="pt-bar">
        <input type="color" id="ptColor" value="#4f8cff">
        <label>Cỡ: <input type="range" id="ptSize" min="1" max="40" value="5"><span id="ptSizeVal">5</span></label>
        <button class="tb-btn" id="ptEraser">🧽 Tẩy</button>
        <button class="tb-btn" id="ptClear">🗑 Xóa hết</button>
        <button class="tb-btn primary" id="ptSave">⬇ Lưu ảnh</button>
      </div>
      <canvas class="pt-canvas" id="ptCanvas"></canvas>
    </div>`;

  const canvas = body.querySelector('#ptCanvas');
  const ctx = canvas.getContext('2d');
  const colorI = body.querySelector('#ptColor');
  const sizeI = body.querySelector('#ptSize');
  const sizeVal = body.querySelector('#ptSizeVal');
  let drawing = false, eraser = false;

  function fit(){
    const r = canvas.parentElement.getBoundingClientRect();
    const bar = body.querySelector('.pt-bar').offsetHeight;
    const w = Math.max(100, Math.floor(r.width));
    const h = Math.max(100, Math.floor(canvas.parentElement.clientHeight - bar));
    const img = ctx.getImageData ? null : null;
    canvas.width = w; canvas.height = h;
    ctx.fillStyle = '#ffffff'; ctx.fillRect(0,0,w,h);
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  }
  setTimeout(fit, 30);
  window.addEventListener('resize', () => {
    if (!document.body.contains(canvas)) return;
    const old = canvas.toDataURL();
    fit();
    const im = new Image();
    im.onload = () => ctx.drawImage(im, 0, 0);
    im.src = old;
  });

  const pos = e => {
    const r = canvas.getBoundingClientRect();
    return { x: e.clientX - r.left, y: e.clientY - r.top };
  };

  canvas.addEventListener('pointerdown', e => {
    drawing = true;
    canvas.setPointerCapture(e.pointerId);
    const p = pos(e);
    ctx.beginPath();
    ctx.moveTo(p.x, p.y);
    ctx.strokeStyle = eraser ? '#ffffff' : colorI.value;
    ctx.lineWidth = parseInt(sizeI.value, 10);
    ctx.lineTo(p.x + 0.01, p.y);
    ctx.stroke();
  });
  canvas.addEventListener('pointermove', e => {
    if (!drawing) return;
    const p = pos(e);
    ctx.lineTo(p.x, p.y);
    ctx.strokeStyle = eraser ? '#ffffff' : colorI.value;
    ctx.lineWidth = parseInt(sizeI.value, 10);
    ctx.stroke();
  });
  const stop = () => { drawing = false; };
  canvas.addEventListener('pointerup', stop);
  canvas.addEventListener('pointerleave', stop);
  canvas.addEventListener('pointercancel', stop);

  sizeI.oninput = () => sizeVal.textContent = sizeI.value;
  body.querySelector('#ptEraser').onclick = e => {
    eraser = !eraser;
    e.target.style.background = eraser ? '#4f8cff' : '';
    e.target.style.color = eraser ? '#fff' : '';
  };
  body.querySelector('#ptClear').onclick = () => {
    if (confirm('Xóa toàn bộ bản vẽ?')) {
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
    }
  };
  body.querySelector('#ptSave').onclick = () => {
    const a = document.createElement('a');
    a.download = 'banve-' + Date.now() + '.png';
    a.href = canvas.toDataURL('image/png');
    a.click();
  };
}

/* ---------- GAME: TIC TAC TOE ---------- */
function buildGame(body){
  body.innerHTML = `
    <div class="ttt">
      <h3>❌ Tic Tac Toe ⭕</h3>
      <div class="ttt-status" id="ttStatus">Lượt của bạn (X)</div>
      <div class="ttt-board" id="ttBoard">
        ${Array.from({length:9},(_,i)=>`<button class="ttt-cell" data-i="${i}"></button>`).join('')}
      </div>
      <button class="tb-btn primary" id="ttReset" style="padding:9px 26px">Chơi lại</button>
      <div style="font-size:11.5px;color:var(--sub)">Bạn là X — Máy là O</div>
    </div>`;

  const boardEl = body.querySelector('#ttBoard');
  const statusEl = body.querySelector('#ttStatus');
  let b, over, turn;

  const LINES = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];

  function winner(bd){
    for (const L of LINES){
      const [a,c,d] = L;
      if (bd[a] && bd[a] === bd[c] && bd[a] === bd[d]) return { p:bd[a], line:L };
    }
    return bd.every(Boolean) ? { p:'draw' } : null;
  }

  function draw(){
    boardEl.querySelectorAll('.ttt-cell').forEach((c,i)=>{
      c.textContent = b[i] === 'X' ? '❌' : b[i] === 'O' ? '⭕' : '';
      c.classList.remove('win');
    });
  }

  function finish(res){
    over = true;
    if (res.p === 'draw') statusEl.textContent = '🤝 Hòa!';
    else if (res.p === 'X') statusEl.textContent = '🎉 Bạn thắng!';
    else statusEl.textContent = '😢 Máy thắng!';
    if (res.line) res.line.forEach(i => boardEl.querySelector(`[data-i="${i}"]`).classList.add('win'));
  }

  function aiMove(){
    const empty = b.map((v,i)=>v?null:i).filter(v=>v!==null);
    // 1. Thắng nếu có thể
    for (const i of empty){ const t=[...b]; t[i]='O'; if (winner(t)?.p==='O') return i; }
    // 2. Chặn người chơi
    for (const i of empty){ const t=[...b]; t[i]='X'; if (winner(t)?.p==='X') return i; }
    // 3. Ưu tiên giữa
    if (b[4]==='') return 4;
    // 4. Ngẫu nhiên
    return empty[Math.floor(Math.random()*empty.length)];
  }

  function step(i){
    if (over || b[i] || !turn) return;
    b[i] = 'X'; draw();
    let res = winner(b);
    if (res) return finish(res);
    turn = false;
    statusEl.textContent = 'Máy đang suy nghĩ...';
    setTimeout(()=>{
      const m = aiMove();
      if (m !== undefined){ b[m] = 'O'; draw(); }
      res = winner(b);
      if (res) return finish(res);
      turn = true;
      statusEl.textContent = 'Lượt của bạn (X)';
    }, 320);
  }

  boardEl.addEventListener('click', e => {
    const c = e.target.closest('.ttt-cell');
    if (c) step(parseInt(c.dataset.i, 10));
  });

  function reset(){
    b = Array(9).fill('');
    over = false; turn = true;
    statusEl.textContent = 'Lượt của bạn (X)';
    draw();
  }
  body.querySelector('#ttReset').onclick = reset;
  reset();
}

/* =========================================================
   HÌNH NỀN
   ========================================================= */
function getWallpaper(){ return parseInt(localStorage.getItem('webos_wp') || '1', 10); }
function setWallpaper(n){
  localStorage.setItem('webos_wp', n);
  const d = document.getElementById('desktop');
  d.className = 'wp' + n;
}

/* =========================================================
   MENU START + ICONS + TASKBAR
   ========================================================= */
const startMenu = document.getElementById('start-menu');
const startBtn  = document.getElementById('start-btn');

function buildStartMenu(){
  const grid = document.getElementById('start-grid');
  grid.innerHTML = Object.entries(APPS).map(([id,a]) =>
    `<button class="app-tile" data-app="${id}"><span class="ic">${a.icon}</span><span>${a.name}</span></button>`
  ).join('');
  grid.onclick = e => {
    const t = e.target.closest('[data-app]');
    if (t) launch(t.dataset.app);
  };
}
function closeStartMenu(){ startMenu.classList.remove('open'); startBtn.classList.remove('active'); }

startBtn.onclick = e => {
  e.stopPropagation();
  const open = startMenu.classList.toggle('open');
  startBtn.classList.toggle('active', open);
};
document.addEventListener('click', e => {
  if (!startMenu.contains(e.target) && e.target !== startBtn) closeStartMenu();
});

function buildDesktopIcons(){
  const wrap = document.getElementById('desktop-icons');
  const order = ['files','notepad','calculator','terminal','paint','browser','game','clock','settings','about'];
  wrap.innerHTML = order.map(id => {
    const a = APPS[id];
    return `<div class="desk-icon" data-app="${id}"><span class="ic">${a.icon}</span><span>${a.name}</span></div>`;
  }).join('');
  wrap.onclick = e => {
    const t = e.target.closest('[data-app]');
    if (t) launch(t.dataset.app);
  };
}

/* Đồng hồ taskbar */
function tickTray(){
  const n = new Date();
  const p = x => String(x).padStart(2,'0');
  document.getElementById('tray-time').textContent =
    p(n.getHours()) + ':' + p(n.getMinutes()) + '  ' + p(n.getDate()) + '/' + (n.getMonth()+1);
}
setInterval(tickTray, 1000);
tickTray();

/* Tray click -> mở đồng hồ */
document.getElementById('tray').onclick = () => launch('clock');

/* =========================================================
   KHỞI ĐỘNG
   ========================================================= */
(function init(){
  setWallpaper(getWallpaper());
  const acc = localStorage.getItem('webos_accent');
  if (acc) document.documentElement.style.setProperty('--accent', acc);

  buildDesktopIcons();
  buildStartMenu();

  // Mở sẵn File Explorer lần đầu
  if (!localStorage.getItem('webos_seen')) {
    localStorage.setItem('webos_seen', '1');
    setTimeout(() => launch('about'), 400);
  }

  // Phím tắt
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') closeStartMenu();
    if (e.altKey && e.key === 'F4' && activeId) { e.preventDefault(); closeWindow(activeId); }
    if (e.key === 'Meta' || (e.ctrlKey && e.key === 'Escape')) {
      e.preventDefault();
      startMenu.classList.toggle('open');
      startBtn.classList.toggle('active', startMenu.classList.contains('open'));
    }
  });
})();
</script>
